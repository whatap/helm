{{- $managedResources := .Values.managedResources | default dict -}}
{{- if or (not (hasKey $managedResources "rbac")) (get $managedResources "rbac") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: whatap-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: whatap-operator
subjects:
  - kind: ServiceAccount
    name: whatap-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
