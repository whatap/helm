namespace: ""

# Resources are managed by this Helm release by default. Disable a group only
# when the same resources are provisioned and maintained outside this chart.
managedResources:
  serviceAccounts: true
  rbac: true
  agentConfigMaps: true
  masterService: true

image:
  repository: public.ecr.aws/whatap/whatap-operator
  tag: 3.0.20
  digest: ""
  pullPolicy: Always

# Image pull secret for private registries
imagePullSecret:
  name: # registryKey

# Pod scheduling and priority options for the operator
priorityClassName: ""
nodeName: ""
nodeSelector: {}
affinity: {}
tolerations: []

credentials:
  create: false
  # The secret name is fixed to 'whatap-credentials'
  license: "" # <license-key>
  host: ""    # <whatap-server-host>
  port: 6600   # <whatap-server-port>
env: